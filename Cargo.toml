[package]
name = "safe-npm"
version = "0.5.0"
edition = "2021"
description = "Static security scanner for npm packages before installation"
license = "MIT"
repository = "https://github.com/mdnbras/safe-npm"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "3"
flate2 = "1"
regex = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
urlencoding = "2"
toml = "1.1"
